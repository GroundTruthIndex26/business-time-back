<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Business Time Back</title>
    <script>
      // GitHub Pages serves this file for unknown paths while leaving the URL alone,
      // so relative asset URLs would break. Hand the path to the SPA entry point
      // instead, which restores it with history.replaceState and routes normally.
      (function () {
        var isProjectSite = window.location.hostname.endsWith("github.io");
        var base = isProjectSite ? "/business-time-back/" : "/";
        var path = window.location.pathname;
        if (isProjectSite && path.indexOf(base) === 0)
          path = path.slice(base.length - 1);
        window.location.replace(
          base +
            "?p=" +
            encodeURIComponent(
              path + window.location.search + window.location.hash
            )
        );
      })();
    </script>
  </head>
  <body></body>
</html>
